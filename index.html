<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Nova</title>
<meta name="description" content="Aurora Nova 的个人主页">
<style>
  :root{
    --bg:#05060f;
    --fg:#e8ecf7;
    --muted:#8a93ad;
    --line:rgba(255,255,255,.08);
    --green:#4ade80;
    --teal:#2dd4bf;
    --violet:#a78bfa;
    --pink:#f472b6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.7;
    overflow-x:hidden;
    position:relative;
  }

  /* 极光背景 */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{
    position:absolute;border-radius:50%;
    filter:blur(90px);
    opacity:.45;
    animation:float 18s ease-in-out infinite;
  }
  .blob.b1{width:520px;height:520px;background:var(--green);top:-180px;left:-120px}
  .blob.b2{width:460px;height:460px;background:var(--teal);top:80px;right:-160px;animation-delay:-6s}
  .blob.b3{width:420px;height:420px;background:var(--violet);bottom:-200px;left:30%;animation-delay:-12s}
  .blob.b4{width:320px;height:320px;background:var(--pink);bottom:60px;right:10%;opacity:.25;animation-delay:-3s}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(40px,-30px) scale(1.08)}
    66%{transform:translate(-30px,20px) scale(.95)}
  }

  /* 星点 */
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),
                     radial-gradient(1px 1px at 70% 15%,#fff,transparent),
                     radial-gradient(1px 1px at 40% 70%,#fff,transparent),
                     radial-gradient(1px 1px at 85% 60%,#fff,transparent),
                     radial-gradient(1px 1px at 10% 80%,#fff,transparent),
                     radial-gradient(1px 1px at 55% 45%,#fff,transparent);}

  main{
    position:relative;z-index:1;
    max-width:760px;
    margin:0 auto;
    padding:clamp(48px,10vh,120px) 24px 56px;
    animation:rise .9s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;color:var(--muted);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    margin-bottom:28px;
    background:rgba(255,255,255,.03);
    backdrop-filter:blur(6px);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 12px var(--green);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  h1{
    font-size:clamp(40px,9vw,68px);
    line-height:1.1;
    letter-spacing:-.02em;
    font-weight:700;
    background:linear-gradient(100deg,var(--green),var(--teal) 40%,var(--violet) 75%,var(--pink));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:20px;
  }
  .lead{
    font-size:clamp(16px,2.6vw,19px);
    color:var(--muted);
    max-width:52ch;
    margin-bottom:44px;
  }
  .lead strong{color:var(--fg);font-weight:600}

  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:44px;
  }
  .card{
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 18px;
    background:rgba(255,255,255,.025);
    transition:transform .3s ease,border-color .3s ease,background .3s ease;
  }
  .card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
  .card h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
  .card p{font-size:15px;color:var(--fg);opacity:.9}

  .links{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:56px}
  .links a{
    display:inline-flex;align-items:center;gap:7px;
    font-size:14px;color:var(--fg);text-decoration:none;
    border:1px solid var(--line);border-radius:10px;
    padding:9px 16px;
    background:rgba(255,255,255,.03);
    transition:all .25s ease;
  }
  .links a:hover{border-color:var(--teal);color:var(--teal);background:rgba(45,212,191,.08)}
  .links a span{opacity:.5;font-size:12px}

  footer{
    border-top:1px solid var(--line);
    padding-top:22px;
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    font-size:13px;color:var(--muted);
  }
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.2)}
  footer a:hover{color:var(--teal)}

  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    footer{flex-direction:column;gap:8px}
  }
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>
<div class="stars"></div>

<main>
  <div class="badge"><span class="dot"></span> Personal space · 建设中</div>

  <h1>Aurora&nbsp;Nova</h1>

  <p class="lead">
    这是我的网站 auroranova.top，目前在念书，学的是<strong>机械设计制造及其自动化</strong>。<br>
    平时喜欢把东西拆开看看里面怎么转，也喜欢把电脑折腾到刚好顺手。<br>
    这里放一些做过的、想过的，和还没想明白的。
  </p>

  <div class="grid">
    <div class="card">
      <h3>About</h3>
      <p>喜欢动手多过背书。</p>
    </div>
    <div class="card">
      <h3>Doing</h3>
      <p>在自学 3D 建模 / 编程 / 剪辑，进展缓慢但没停。</p>
    </div>
    <div class="card">
      <h3>Contact</h3>
      <p>邮件最快，其他随缘。</p>
    </div>
  </div>

  <div class="links">
    <a href="https://github.com/YIBO06" target="_blank" rel="noopener">GitHub <span>↗</span></a>
    <a href="https://outlook.live.com/mail/0/deeplink/compose?to=gjhuyibo@outlook.com" target="_blank" rel="noopener">邮箱 <span>↗</span></a>
  </div>

  <footer>
    <span>© <span id="year">2026</span> Aurora Nova</span>
    <span>Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></span>
  </footer>
</main>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
